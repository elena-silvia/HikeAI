services:
  - type: web
    name: romountainagent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app_server:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL
        value: gemini-3.5-flash-lite
      - key: KNOWLEDGE_SOURCE
        value: local
      - key: LOCAL_KNOWLEDGE_DIRECTORY
        value: knowledge
      - key: GOOGLE_API_KEY
        sync: false
      - key: APP_ACCESS_PASSCODE
        sync: false
